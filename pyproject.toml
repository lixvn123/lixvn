[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lixvn"
version = "0.4.2"
description = "High-performance autonomous agent swarm runtime engineered for Anthropic Claude 3.5 Sonnet."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Lixvn Authors", email = "contact@lixvn.dev"}
]
keywords = [
    "anthropic",
    "claude",
    "claude-3-5-sonnet",
    "agent-swarm",
    "autonomous-agents",
    "orchestration",
    "runtime",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://lixvn.dev"
Repository = "https://github.com/lixvn123/lixvn"
Documentation = "https://lixvn.dev#code"

[tool.setuptools.packages.find]
where = ["."]
include = ["lixvn*"]

[tool.setuptools.package-data]
lixvn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
